<!-- @dsCard group="Colors" viewport="700x190" name="Surface ramp" subtitle="Warm-black stack — never pure #000" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; background: var(--stout); font-family: var(--font-sans); padding: 22px; }
  .row { display: flex; gap: 14px; }
  .sw { flex: 1; }
  .chip { height: 84px; border-radius: var(--radius-md); border: 1px solid var(--line); }
  .name { color: var(--cream); font-size: 12px; font-weight: 600; margin-top: 10px; }
  .hex { color: var(--muted); font-size: 11px; font-family: var(--font-ui); margin-top: 2px; letter-spacing: 0.02em; }
  .role { color: var(--muted); font-size: 10px; margin-top: 4px; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw">
      <div class="chip" style="background: var(--stout);"></div>
      <div class="name">stout</div><div class="hex">#13110F</div>
      <div class="role">Page background</div>
    </div>
    <div class="sw">
      <div class="chip" style="background: var(--graphite);"></div>
      <div class="name">graphite</div><div class="hex">#1E1B17</div>
      <div class="role">Cards · inputs · nav</div>
    </div>
    <div class="sw">
      <div class="chip" style="background: var(--elevated);"></div>
      <div class="name">elevated</div><div class="hex">#252119</div>
      <div class="role">Hover · avatar</div>
    </div>
    <div class="sw">
      <div class="chip" style="background: var(--line);"></div>
      <div class="name">line</div><div class="hex">#332D24</div>
      <div class="role">1px borders</div>
    </div>
  </div>
</body>
</html>
