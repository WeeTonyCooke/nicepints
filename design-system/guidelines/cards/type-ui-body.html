<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; background: var(--stout); padding: 24px; font-family: var(--font-sans); color: var(--cream); }
  .h3 { font-weight: 700; font-size: 18px; }
  .body { font-size: 16px; color: var(--cream); line-height: 1.4; margin-top: 8px; max-width: 460px; }
  .sec { font-size: 16px; color: var(--muted); margin-top: 4px; }
  .label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); font-weight: 600; margin-top: 14px; }
  .meta { color: var(--muted); font-size: 11px; margin-top: 14px; font-family: var(--font-ui); }
  .meta b { color: var(--cream); font-weight: 600; }
</style>
</head>
<body>
  <div class="h3">The Sandymount House</div>
  <div class="body">"Proper two-part pour, sat a full minute. The dome on it was a beauty — lacing all the way down."</div>
  <div class="label">Logged nearby · 4 this month</div>
  <div class="meta"><b>DM Sans</b> · 400 / 500 / 600 / 700 · humanist geometric sans</div>
</body>
</html>
