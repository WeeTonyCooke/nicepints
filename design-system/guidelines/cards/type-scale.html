<!-- @dsCard group="Type" viewport="700x140" name="Type scale" subtitle="Mobile-first ramp — score down to micro chip" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; background: var(--stout); padding: 22px; font-family: var(--font-sans); color: var(--cream); }
  table { border-collapse: collapse; width: 100%; }
  td { padding: 4px 0; vertical-align: baseline; }
  .tok { font-family: var(--font-ui); color: var(--muted); font-size: 11px; width: 130px; }
  .px { font-family: var(--font-ui); color: var(--muted); font-size: 11px; width: 60px; text-align: right; padding-right: 18px; }
  .samp { color: var(--cream); }
</style>
</head>
<body>
  <table>
    <tr><td class="px">32px</td><td class="tok">--text-h1</td><td class="samp" style="font-size:24px;font-weight:700;">A serious pint</td></tr>
    <tr><td class="px">18px</td><td class="tok">--text-h3</td><td class="samp" style="font-size:18px;font-weight:700;">Keogh's of Dublin</td></tr>
    <tr><td class="px">16px</td><td class="tok">--text-body</td><td class="samp" style="font-size:16px;">A lovely drop, settled well.</td></tr>
    <tr><td class="px">11px</td><td class="tok">--text-label</td><td class="samp" style="font-size:11px;text-transform:uppercase;letter-spacing:0.12em;color:var(--muted);font-weight:600;">Latest · 12 pints</td></tr>
  </table>
</body>
</html>
