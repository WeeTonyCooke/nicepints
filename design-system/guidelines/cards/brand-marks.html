<!-- @dsCard group="Brand" viewport="700x200" name="Marks & icons" subtitle="Pint silhouette, app icon, favicon — one shape across every size" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; background: var(--stout); padding: 26px; font-family: var(--font-ui); display: flex; gap: 40px; align-items: center; }
  .col { text-align: center; }
  .col img { display: block; margin: 0 auto; }
  .v { color: var(--cream); font-size: 11px; margin-top: 12px; font-weight: 600; }
  .t { color: var(--muted); font-size: 9px; margin-top: 2px; }
  .appicon { width: 96px; height: 96px; border-radius: 22px; border: 1px solid var(--line); }
  .fav { width: 40px; height: 40px; border-radius: 9px; }
  .sil { width: 40px; height: 64px; }
</style>
</head>
<body>
  <div class="col">
    <img class="appicon" src="../../assets/brand/icon.svg" alt="Nice Pints app icon" />
    <div class="v">App icon</div><div class="t">cream head · stout body on black</div>
  </div>
  <div class="col">
    <img class="fav" src="../../assets/brand/icon.svg" alt="favicon" />
    <div class="v">Favicon 32</div><div class="t">same mark, scaled</div>
  </div>
  <div class="col">
    <img class="sil" src="../../assets/brand/pint-silhouette.svg" alt="pint silhouette" />
    <div class="v">Pint silhouette</div><div class="t">Guinness tulip · flared rim · no base line</div>
  </div>
</body>
</html>
