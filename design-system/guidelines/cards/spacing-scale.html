<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing scale" subtitle="4px base — 20px screen edge, 32px section rhythm" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; background: var(--stout); padding: 24px; font-family: var(--font-ui); display: flex; gap: 18px; align-items: flex-end; }
  .col { text-align: center; }
  .bar { background: var(--gold); border-radius: 2px; width: 26px; }
  .v { color: var(--cream); font-size: 11px; margin-top: 8px; }
  .t { color: var(--muted); font-size: 9px; margin-top: 2px; }
</style>
</head>
<body>
  <div class="col"><div class="bar" style="height:8px;"></div><div class="v">8</div><div class="t">2</div></div>
  <div class="col"><div class="bar" style="height:12px;"></div><div class="v">12</div><div class="t">3</div></div>
  <div class="col"><div class="bar" style="height:16px;"></div><div class="v">16</div><div class="t">4</div></div>
  <div class="col"><div class="bar" style="height:20px;"></div><div class="v">20</div><div class="t">5 · edge</div></div>
  <div class="col"><div class="bar" style="height:24px;"></div><div class="v">24</div><div class="t">6</div></div>
  <div class="col"><div class="bar" style="height:32px;"></div><div class="v">32</div><div class="t">8 · section</div></div>
  <div class="col"><div class="bar" style="height:48px;"></div><div class="v">48</div><div class="t">12</div></div>
</body>
</html>
