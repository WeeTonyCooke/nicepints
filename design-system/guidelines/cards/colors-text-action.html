<!-- @dsCard group="Colors" viewport="700x190" name="Text & action" subtitle="Cream and muted for type; gold is seasoning, not gravy" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; background: var(--stout); font-family: var(--font-sans); padding: 22px; }
  .row { display: flex; gap: 14px; }
  .sw { flex: 1; }
  .chip { height: 84px; border-radius: var(--radius-md); border: 1px solid var(--line); }
  .name { color: var(--cream); font-size: 12px; font-weight: 600; margin-top: 10px; }
  .hex { color: var(--muted); font-size: 11px; font-family: var(--font-ui); margin-top: 2px; letter-spacing: 0.02em; }
  .role { color: var(--muted); font-size: 10px; margin-top: 4px; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw">
      <div class="chip" style="background: var(--cream);"></div>
      <div class="name">cream</div><div class="hex">#F3EFE6</div>
      <div class="role">Body text · stat values</div>
    </div>
    <div class="sw">
      <div class="chip" style="background: var(--muted);"></div>
      <div class="name">muted</div><div class="hex">#8C8579</div>
      <div class="role">Labels · secondary copy</div>
    </div>
    <div class="sw">
      <div class="chip" style="background: var(--gold);"></div>
      <div class="name">gold</div><div class="hex">#C8A24B</div>
      <div class="role">Primary CTA · active tab</div>
    </div>
    <div class="sw">
      <div class="chip" style="background: var(--gold-soft);"></div>
      <div class="name">gold-soft</div><div class="hex">#3A301A</div>
      <div class="role">Active filter pill bg</div>
    </div>
  </div>
</body>
</html>
