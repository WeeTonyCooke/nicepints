<!-- @dsCard group="Brand" viewport="700x260" name="Photo treatment" subtitle="Light scrim + bottom gradient; score over the pour, never a frame" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; background: var(--stout); padding: 22px; font-family: var(--font-sans); }
  .card { position: relative; width: 280px; height: 210px; border-radius: var(--radius-lg); overflow: hidden; border: 1px solid var(--line); }
  .card img { width: 100%; height: 100%; object-fit: cover; }
  .score { position: absolute; top: 14px; right: 16px; font-family: var(--font-display); font-weight: 800; font-size: 44px; line-height: 1; color: var(--np-cream); letter-spacing: -0.03em; text-shadow: var(--shadow-score); }
  .score .frac { font-size: 0.34em; vertical-align: 0.2em; }
  .chip { position: absolute; left: 14px; bottom: 38px; background: var(--graphite); border: 1px solid var(--line); border-left: 3px solid var(--cream); padding: 3px 8px; border-radius: var(--radius-chip); font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--cream); }
  .name { position: absolute; left: 14px; bottom: 12px; font-family: var(--font-display); font-weight: 900; font-size: 20px; color: var(--cream); text-shadow: var(--shadow-score); }
</style>
</head>
<body>
  <div class="card np-noise">
    <img src="../../assets/photos/keoghs_dublin.jpeg" alt="Pint at Keogh's" />
    <div class="np-photo-scrim-base" style="position:absolute;inset:0;"></div>
    <div class="np-photo-scrim-gradient" style="position:absolute;inset:0;"></div>
    <div class="score">9<span class="frac">.4</span></div>
    <div class="chip">Guinness</div>
    <div class="name">Keogh's of Dublin</div>
  </div>
</body>
</html>
