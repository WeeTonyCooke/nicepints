<!-- @dsCard group="Colors" viewport="700x150" name="Status colours" subtitle="Sage for good, rust for error / delete" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; background: var(--stout); font-family: var(--font-sans); padding: 22px; }
  .row { display: flex; gap: 14px; }
  .sw { flex: 1; }
  .chip { height: 56px; border-radius: var(--radius-md); border: 1px solid var(--line); }
  .name { color: var(--cream); font-size: 12px; font-weight: 600; margin-top: 10px; }
  .hex { color: var(--muted); font-size: 11px; font-family: var(--font-ui); margin-top: 2px; }
  .role { color: var(--muted); font-size: 10px; margin-top: 4px; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw">
      <div class="chip" style="background: var(--sage);"></div>
      <div class="name">sage</div><div class="hex">#7A9B76</div>
      <div class="role">Positive · ratings ≥ 7</div>
    </div>
    <div class="sw">
      <div class="chip" style="background: var(--sage-tint);"></div>
      <div class="name">sage-tint</div><div class="hex">#1C241B</div>
      <div class="role">Positive chip bg</div>
    </div>
    <div class="sw">
      <div class="chip" style="background: var(--rust);"></div>
      <div class="name">rust</div><div class="hex">#B8634A</div>
      <div class="role">Error · delete · ratings &lt; 5</div>
    </div>
    <div class="sw">
      <div class="chip" style="background: var(--rust-tint);"></div>
      <div class="name">rust-tint</div><div class="hex">#241A16</div>
      <div class="role">Error chip bg</div>
    </div>
  </div>
</body>
</html>
