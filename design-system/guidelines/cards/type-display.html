<!-- @dsCard group="Type" viewport="700x200" name="Display — Playfair" subtitle="Wordmark, screen H1s, pub names. Black weight, tight tracking" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; background: var(--stout); padding: 24px; font-family: var(--font-sans); }
  .big { font-family: var(--font-display); font-weight: 900; color: var(--cream); font-size: 44px; line-height: 1.05; letter-spacing: -0.03em; }
  .big em { color: var(--gold); font-style: italic; }
  .meta { color: var(--muted); font-size: 11px; margin-top: 14px; font-family: var(--font-ui); }
  .meta b { color: var(--cream); font-weight: 600; }
</style>
</head>
<body>
  <div class="big">Keogh's of Dublin</div>
  <div class="big" style="font-size: 30px; margin-top: 6px;">Nice <em>Pints</em></div>
  <div class="meta"><b>Playfair Display</b> · 900 black · tracking −0.03em · serif high-contrast</div>
</body>
</html>
