<!-- @dsCard group="Brand" viewport="700x180" name="Wordmark" subtitle="Playfair black; 'Pints' set gold italic. Optional pint mark leads" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; background: var(--stout); padding: 28px; font-family: var(--font-sans); display: flex; align-items: center; gap: 48px; }
  .lockup { display: inline-flex; align-items: center; gap: 14px; }
  .lockup img { height: 52px; width: auto; display: block; }
  .mark { font-family: var(--font-display); font-weight: 900; letter-spacing: -0.02em; color: var(--cream); font-size: 40px; line-height: 1; }
  .mark em { color: var(--gold); font-style: italic; }
  .stack { display: flex; flex-direction: column; gap: 18px; }
  .small { font-size: 22px; }
  .meta { color: var(--muted); font-size: 11px; font-family: var(--font-ui); line-height: 1.6; }
</style>
</head>
<body>
  <div class="lockup">
    <img src="../../assets/brand/pint-silhouette.svg" alt="" />
    <span class="mark">Nice <em>Pints</em></span>
  </div>
  <div class="stack">
    <span class="mark small">Nice <em>Pints</em></span>
    <div class="meta">Icon lockup for headers ·<br/>wordmark-only elsewhere ·<br/>gold appears on "Pints" only</div>
  </div>
</body>
</html>
