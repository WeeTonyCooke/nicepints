<!-- @startingPoint section="App" subtitle="Nice Pints mobile app — feed, find, detail" viewport="430x780" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Nice Pints — App</title>
<link rel="icon" href="../../assets/brand/favicon.svg" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  html, body { margin: 0; background: #080706; }
  body { min-height: 100vh; display: flex; justify-content: center; }
  #phone {
    position: relative; width: 100%; max-width: 430px; min-height: 100vh;
    background: var(--stout); color: var(--cream);
    font-family: var(--font-sans);
    box-shadow: 0 0 60px rgba(0,0,0,0.6);
    overflow-x: hidden;
  }
  /* bottom nav anchored to the column */
  #navwrap {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 430px; padding: 0 20px 24px; box-sizing: border-box;
    z-index: 50; pointer-events: none;
    background: linear-gradient(to top, var(--stout) 30%, transparent);
    padding-top: 28px;
  }
  #navwrap > div { pointer-events: auto; }
  ::-webkit-scrollbar { display: none; }
</style>
</head>
<body>
<div id="phone">
  <div id="app"></div>
</div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="data.js"></script>
<script type="text/babel" src="primitives.jsx"></script>
<script type="text/babel" src="screens.jsx"></script>
<script type="text/babel">
  const { useState } = React;
  const { Feed, Find, PintDetail } = window.NP_SCREENS;
  const { I } = window.NP;

  function Nav({ active, go }) {
    const tab = (id, label, icon) => {
      const on = active === id;
      return (
        <button onClick={() => go(id)} style={{ flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', gap: '4px', padding: '8px 0', background: 'none', border: 'none', cursor: 'pointer', color: on ? 'var(--gold)' : 'var(--muted)' }}>
          {icon}<span style={{ fontSize: '10px', fontWeight: 500 }}>{label}</span>
        </button>
      );
    };
    return (
      <div style={{ display: 'flex', alignItems: 'center', height: '64px', background: 'rgba(30,27,23,0.95)', backdropFilter: 'blur(16px)', borderRadius: '9999px', border: '1px solid var(--line)', boxShadow: 'var(--shadow-nav)' }}>
        {tab('feed', 'Feed', I.feed)}
        {tab('find', 'Find', I.find)}
        <div style={{ flex: 1, display: 'flex', justifyContent: 'center' }}>
          <button onClick={() => go('feed')} aria-label="Log a pint" style={{ width: '48px', height: '48px', marginTop: '-32px', background: 'var(--gold)', color: 'var(--stout)', borderRadius: '9999px', border: 'none', boxShadow: 'var(--shadow-card)', display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer' }}>{I.plus}</button>
        </div>
        {tab('profile', 'Profile', I.user)}
      </div>
    );
  }

  function App() {
    const [screen, setScreen] = useState('feed');
    const [pint, setPint] = useState(null);
    const go = (s, p) => { if (p) setPint(p); setScreen(s); window.scrollTo(0, 0); };

    let view;
    if (screen === 'find') view = <Find go={go} />;
    else if (screen === 'pint') view = <PintDetail pint={pint} go={go} />;
    else if (screen === 'profile') view = <Find go={go} />; // profile not in kit — route to Find
    else view = <Feed go={go} />;

    const navActive = screen === 'pint' ? 'feed' : screen;
    return (
      <>
        {view}
        <div id="navwrap"><div><Nav active={navActive} go={go} /></div></div>
      </>
    );
  }

  ReactDOM.createRoot(document.getElementById('app')).render(<App />);
</script>
</body>
</html>
