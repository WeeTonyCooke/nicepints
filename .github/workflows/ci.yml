name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# One deploy at a time on main — avoids overlapping Netlify builds.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck & build
    runs-on: ubuntu-latest
    env:
      # Placeholder — real values only on Netlify / local .env (never commit secrets).
      VITE_SUPABASE_URL: https://placeholder.supabase.co
      VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.placeholder

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: sh scripts/verify-migrations.sh

      - run: npm run typecheck

      - run: npm run build

      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        with:
          name: web-dist
          path: dist/
          retention-days: 14

  smoke:
    name: Playwright e2e
    runs-on: ubuntu-latest
    needs: quality
    env:
      VITE_SUPABASE_URL: https://placeholder.supabase.co
      VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.placeholder

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Optional — only runs when you explicitly enable it (see docs/DEPLOY.md).
  # Uses a Netlify build hook (deploy-only, no repo write access).
  deploy:
    name: Deploy to Netlify
    runs-on: ubuntu-latest
    needs: smoke
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      vars.ENABLE_NETLIFY_DEPLOY == 'true'
    environment: production

    steps:
      - name: Trigger Netlify production build
        run: curl -fsSL -X POST -d {} "${{ secrets.NETLIFY_BUILD_HOOK }}"
