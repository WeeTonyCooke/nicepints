name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# One deploy at a time on main — avoids overlapping Netlify builds.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck & build
    runs-on: ubuntu-latest
    env:
      # Placeholder — real values only on Netlify / local .env (never commit secrets).
      VITE_SUPABASE_URL: https://placeholder.supabase.co
      VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.placeholder

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: sh scripts/verify-migrations.sh

      - run: npm run typecheck

      - run: npm run build

      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        with:
          name: web-dist
          path: dist/
          retention-days: 14

  smoke:
    name: Playwright e2e
    runs-on: ubuntu-latest
    needs: quality
    env:
      VITE_SUPABASE_URL: https://placeholder.supabase.co
      VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.placeholder

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  e2e-live:
    name: Playwright e2e (real Supabase)
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Start Supabase
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - run: supabase start

      - name: Apply migrations
        run: supabase db reset --local

      - name: Export local Supabase env
        run: |
          echo "::group::supabase status -o env (raw)"
          supabase status -o env
          echo "::endgroup::"

          set -a
          source <(supabase status -o env)
          set +a
          echo "VITE_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"

          MAIL_CAPTURE_URL="${MAILPIT_URL:-${INBUCKET_URL:-http://127.0.0.1:54324}}"
          echo "SUPABASE_INBUCKET_URL=$MAIL_CAPTURE_URL" >> "$GITHUB_ENV"
          echo "MAILPIT_URL=$MAIL_CAPTURE_URL" >> "$GITHUB_ENV"
          echo "Resolved SUPABASE_INBUCKET_URL=$MAIL_CAPTURE_URL"

      - run: npm run test:e2e:live
        env:
          VITE_SUPABASE_URL: ${{ env.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ env.VITE_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_INBUCKET_URL: ${{ env.SUPABASE_INBUCKET_URL }}
          MAILPIT_URL: ${{ env.MAILPIT_URL }}

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-live-report
          path: playwright-report/
          retention-days: 7

  # Optional — only runs when you explicitly enable it (see docs/DEPLOY.md).
  # Uses a Netlify build hook (deploy-only, no repo write access).
  deploy:
    name: Deploy to Netlify
    runs-on: ubuntu-latest
    needs: smoke
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      vars.ENABLE_NETLIFY_DEPLOY == 'true'
    environment: production

    steps:
      - name: Trigger Netlify production build
        run: curl -fsSL -X POST -d {} "${{ secrets.NETLIFY_BUILD_HOOK }}"
